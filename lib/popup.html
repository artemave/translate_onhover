<template id="transover-popup-template">
  <style>
    :host {
      color-scheme: light dark;
      --text: light-dark(#333, #e6e3d3);
      --muted: light-dark(grey, #9e9b8f);
      --error: light-dark(red, #ff6b6b);
      --background: light-dark(#fcf7d9, #2e2c25);
      --border: light-dark(#ccc, #55524a);
      --shadow: light-dark(rgba(0,0,0,0.2), rgba(0,0,0,0.6));
    }

    :host([theme="light"]) {
      color-scheme: light;
    }

    :host([theme="dark"]) {
      color-scheme: dark;
    }

    .pos_translation {
      padding-bottom: 3px;
    }

    strong {
      font-weight: bold;
    }

    .rtl {
      direction: rtl;
    }

    main {
      color: var(--text);
      max-width: 800px;
      font-family: Arial, sans-serif;
      font-size: 14px;
      font-weight: 300;
      letter-spacing: initial;

      background: var(--background);
      text-align: left;
      border-style: solid;
      border-width: 1px;
      border-color: var(--border);
      box-shadow: var(--shadow) 0px 2px 5px;
      border-radius: 5px;
      padding: 6px 8px 3px 8px;
      position: fixed;
      z-index: 2147483647;
      top: -1500px;
      left: 0;
      box-sizing: content-box;
      -webkit-font-smoothing: antialiased;
      font-smoothing: antialiased;
      text-rendering: optimizeLegibility;

      /* To fix the following issue:
      1. Have translate on hover enabled (opposed to translate on click).
      2. Visit a website that has a dropdown menu that opens on hover.
      3. Open the menu.
      4. Hover over a word within that menu.
      5. Incidentally move the cursor over the TransOver popup.
      The hover menu gets closed.
      */
      pointer-events: none;
    }

    .pos_translation {
      font-size: 1em;
      line-height: 1.3em;
    }

    .red {
      color: var(--error);
    }

    .from_lang {
      color: var(--muted);
      font-size: 0.8em;
      line-height: 1.2em;
      margin-top: 2px;
      margin-bottom: 3px;
    }
  </style>

  <main translate="no"></main>
</template>
